name: Leaned Paper — compile and axiom audit

on:
  push:
    branches: [leaned-paper, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leaned-paper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Lean and obtain matching Mathlib artifacts
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"
      - name: Check toolchain, dependency pin and complete module plan
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          python3 - <<'PY'
          import json, pathlib, re, subprocess, tomllib
          root = pathlib.Path('.')
          assert (root / 'lean-toolchain').read_text().strip() == 'leanprover/lean4:v4.33.0'
          assert 'version 4.33.0,' in subprocess.check_output(['lean', '--version'], text=True)
          pin = 'db584cd6d46c92f209a44c0f1c829460d327499d'
          config = tomllib.loads((root / 'lakefile.toml').read_text())
          assert config['require'][0]['rev'] == pin
          manifest = json.loads((root / 'lake-manifest.json').read_text())
          assert next(p['rev'] for p in manifest['packages'] if p['name'] == 'mathlib') == pin
          actual = subprocess.check_output(['git', '-C', '.lake/packages/mathlib', 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == pin
          modules = [s.strip() for s in (root / 'modules.txt').read_text().splitlines() if s.strip() and not s.startswith('#')]
          assert modules[-1] == 'LeanPaper.KernelAudit'
          assert len(modules) == len(set(modules))
          assert config['lean_lib'][0]['roots'] == modules
          sources = {str(p.relative_to(root / 'src').with_suffix('')).replace('/', '.') for p in (root / 'src').rglob('*.lean')}
          assert sources == set(modules)
          order = {m:i for i,m in enumerate(modules)}
          for m in modules:
              source = (root / 'src' / (m.replace('.', '/') + '.lean')).read_text()
              for dep in re.findall(r'^import\s+([A-Za-z0-9_.]+)', source, re.M):
                  if dep in order:
                      assert order[dep] < order[m], (m, dep)
                  else:
                      assert dep.startswith(('Mathlib', 'Lean', 'Std', 'Init')), (m, dep)
          audit = (root / 'src/LeanPaper/KernelAudit.lean').read_text()
          owned = set(re.findall(r'^\s*`([A-Za-z0-9_.]+)[,\]]', audit, re.M))
          assert owned == set(modules) - {'LeanPaper.KernelAudit'}
          print(f'MODULE_PLAN_ACCEPTED={len(modules)}')
          PY
      - name: Check dependency scheduler without invoking Lean
        run: python3 -m unittest discover -s scripts -p 'test_ci_verify.py' -v
      - name: Compile independent modules and run the transitive axiom gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -u scripts/ci_verify.py --jobs 2
      - name: Retain compiler and audit logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leaned-paper-linux-${{ github.sha }}
          path: .build/ci-lean
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
